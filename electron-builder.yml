# 打包配置（Windows x64）
#
# 体积取舍原则：只删除「在 Windows x64 上不可能被加载」的文件，不为体积牺牲功能路径。
# 因此明确保留以下几项，尽管它们体积可观：
#   - dxcompiler.dll / dxil.dll（27 MB）：WebGPU(Dawn) 与 D3D12 着色器编译。
#     本应用不使用 WebGPU，但 GPU 进程初始化可能依赖它们；本机为软件渲染环境，
#     无法验证硬件 GPU 路径，故不裁剪。
#   - vk_swiftshader.dll / vulkan-1.dll（7 MB）：无可用 GPU 时的软件渲染兜底。
#     裁掉会让「显卡不可用」的机器直接渲染失败。
#   - ffmpeg.dll（3 MB）：媒体解码。
#   - chrome_200_percent.pak（2 MB）：HiDPI 缩放。
#   - LICENSES.chromium.html（20 MB）：Chromium 第三方许可证，属分发合规要求。
# 如需进一步压缩，见 README「分发体积」一节的取舍说明。

appId: com.miasakii.local-project-workbench
productName: 本地项目工作台
copyright: Copyright © 2026 miasakii

directories:
  output: release
  buildResources: build

# Electron 发行包走国内镜像。
# 直连 GitHub Releases 在部分网络下会长时间无响应（打包会静默卡住），
# 与 npm install electron 时使用 ELECTRON_MIRROR 是同一原因。
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

# 只打包运行必需的产物；源码、验证脚本、文档一律不进包。
# 生产依赖只有 node-pty（其余前端依赖已被 Vite 打进 out/renderer）。
files:
  - out/**/*
  - package.json
  # node-pty 的调试符号运行时永不加载，四个平台的 prebuilds 里共占 54 MB
  - '!**/node_modules/node-pty/prebuilds/**/*.pdb'
  # 只发 Windows x64：剔除 arm64 与 macOS 预编译产物（共 30 MB）
  - '!**/node_modules/node-pty/prebuilds/win32-arm64/**'
  - '!**/node_modules/node-pty/prebuilds/darwin-*/**'
  # ConPTY 的第三方运行时同样按架构分发，只保留 x64
  - '!**/node_modules/node-pty/third_party/**/win10-arm64/**'
  - '!**/*.{md,map,ts,tsbuildinfo}'
  - '!**/{test,tests,__tests__,example,examples,doc,docs}/**'

asar: true
# 原生模块必须解包到 asar 之外才能被 dlopen
asarUnpack:
  - '**/node_modules/node-pty/**'

# node-pty 基于 N-API，产物与 Electron ABI 无关，**不需要** electron-rebuild
# （M0-1 已验证）。保留默认的自动重建会调用 node-gyp + MSBuild，在缺少
# Spectre 缓解库的机器上必然失败，而重建本身毫无必要。
npmRebuild: false

# Electron 自带 55 个语言包共 49 MB；界面为简体中文，只需 zh-CN 与 en-US。
# 不用 electron-builder 的 electronLanguages（它先全量复制再逐个删除），
# 改为指向 scripts/prepare-electron-dist.cjs 预先生成的裁剪版运行时：
# 只复制需要的语言包，全程无删除动作，结果更确定。
electronDist: build/electron-dist

win:
  # 应用图标：由 scripts/build-icon.mjs 程序化生成（build/icon.ico，多尺寸 ICO）。
  # 同时作用于安装包、任务栏、窗口标题栏与资源管理器；缺省时用 Electron 默认图标。
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 本地项目工作台
  # 卸载不删除用户数据目录（projects.json 与视图状态属于用户数据）
  deleteAppDataOnUninstall: false

# LZMA 极限压缩：直接换更小的安装包，代价是打包更慢
compression: maximum
